<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Sun Rays & Rising Sun in Background -->
  <path d="M70 105 A30 30 0 0 1 130 105 Z" fill="url(#sunGrad)" opacity="0.9"/>
  <line x1="100" y1="70" x2="100" y2="60" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="75" x2="75" y2="67" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="118" y1="75" x2="125" y2="67" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="90" x2="58" y2="86" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="132" y1="90" x2="142" y2="86" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rolling Fertile Farm Furrows -->
  <path d="M25 125 Q60 112 100 120 Q140 128 175 122 L175 170 A96 96 0 0 1 25 170 Z" fill="#047857"/>
  <path d="M35 140 Q70 130 105 138 Q140 146 165 140 L165 170 A96 96 0 0 1 35 170 Z" fill="#065f46"/>

  <!-- Central Sprout (Two Vibrant Natural Leaves) -->
  <!-- Left Leaf -->
  <path d="M100 120 C85 105 75 85 92 70 C102 85 102 105 100 120 Z" fill="url(#leafGrad)"/>
  <!-- Right Leaf -->
  <path d="M100 120 C115 105 125 85 108 70 C98 85 98 105 100 120 Z" fill="url(#leafGrad)"/>
  <!-- Central Veins -->
  <path d="M100 120 L96 75" stroke="#ecfdf5" stroke-width="1.2" opacity="0.6"/>
  <path d="M100 120 L104 75" stroke="#ecfdf5" stroke-width="1.2" opacity="0.6"/>

  <!-- Golden Ears of Grain (Paddy / Wheat Sheaves on Left & Right) -->
  <!-- Left Sheaf -->
  <g fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5">
    <ellipse cx="45" cy="85" rx="4" ry="7" transform="rotate(-30 45 85)"/>
    <ellipse cx="40" cy="98" rx="4" ry="7" transform="rotate(-20 40 98)"/>
    <ellipse cx="38" cy="112" rx="4" ry="7" transform="rotate(-10 38 112)"/>
    <ellipse cx="50" cy="74" rx="3.5" ry="6.5" transform="rotate(-40 50 74)"/>
    <ellipse cx="58" cy="65" rx="3.5" ry="6.5" transform="rotate(-50 58 65)"/>
    <path d="M38 125 C36 100 50 75 65 60" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>
  <!-- Right Sheaf -->
  <g fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5">
    <ellipse cx="155" cy="85" rx="4" ry="7" transform="rotate(30 155 85)"/>
    <ellipse cx="160" cy="98" rx="4" ry="7" transform="rotate(20 160 98)"/>
    <ellipse cx="162" cy="112" rx="4" ry="7" transform="rotate(10 162 112)"/>
    <ellipse cx="150" cy="74" rx="3.5" ry="6.5" transform="rotate(40 150 74)"/>
    <ellipse cx="142" cy="65" rx="3.5" ry="6.5" transform="rotate(50 142 65)"/>
    <path d="M162 125 C164 100 150 75 135 60" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>

  <!-- Circular Ribbons / Kannada & English Government Seal Text -->
  <path id="textArcTop" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
  <text fill="#fbbf24" font-size="11" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" letter-spacing="2.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ಕರ್ನಾಟಕ ಸರ್ಕಾರ • ಕೃಷಿ ಇಲಾಖೆ
    </textPath>
  </text>

  <path id="textArcBottom" d="M 170 108 A 72 72 0 0 1 30 108" fill="none"/>
  <text fill="#ffffff" font-size="8.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" letter-spacing="1.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      GOVERNMENT OF KARNATAKA • RAITHA MITRA
    </textPath>
  </text>

  <!-- Small Five-point Stars -->
  <polygon points="26,102 28,105 25,107 29,107 30,110 31,107 35,107 32,105 34,102 30,104" fill="#fbbf24"/>
  <polygon points="174,102 176,105 173,107 177,107 178,110 179,107 183,107 180,105 182,102 178,104" fill="#fbbf24"/>
</svg>
